<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f3f5f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:400px;
background:#fff;
padding:35px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:25px;
color:#4a7dff;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;
}

.options{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
font-size:14px;
}

.options label{
display:flex;
align-items:center;
gap:5px;
}

.options input[type="checkbox"]{
width:auto;
margin:0;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#4a7dff;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#2f67ef;
}

#error{
margin-top:15px;
text-align:center;
color:red;
font-size:14px;
}

p{
text-align:center;
margin-top:20px;
}

a{
color:#4a7dff;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Login</h2>

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<div class="options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<div id="error"></div>

<button onclick="login()">
Login
</button>

<p>
Don't have an account?
<a href="register.html">Register</a>
</p>

</div>

<script>

function login(){

let email=document.getElementById("email").value.trim();

let password=document.getElementById("password").value;

let user=JSON.parse(localStorage.getItem("user"));

if(user==null){

document.getElementById("error").innerHTML="No account found. Please register first.";

return;

}

if(email===user.email && password===user.password){

localStorage.setItem("loggedIn","true");

localStorage.setItem("currentUser",user.name);

window.location="index.html";

}

else{

document.getElementById("error").innerHTML="Invalid Email or Password.";

}

}

</script>

</body>
</html>
