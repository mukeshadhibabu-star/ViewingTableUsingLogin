<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f3f5f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:400px;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:25px;
color:#4a7dff;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#28a745;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#218838;
}

p{
text-align:center;
margin-top:20px;
}

a{
color:#4a7dff;
text-decoration:none;
font-weight:bold;
}

.error{
color:red;
font-size:14px;
margin-top:10px;
text-align:center;
}

.success{
color:green;
font-size:14px;
margin-top:10px;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<label>
    <input type="checkbox" onclick="showPassword()">
    Show Password
</label>

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<div id="message"></div>

<button onclick="register()">
Register
</button>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script>

function register(){

let name=document.getElementById("name").value.trim();

let email=document.getElementById("email").value.trim();

let password=document.getElementById("password").value;

let confirm=document.getElementById("confirmPassword").value;

let msg=document.getElementById("message");

if(name=="" || email=="" || password=="" || confirm==""){

msg.innerHTML="<div class='error'>Please fill all fields.</div>";

return;

}

if(password!=confirm){

msg.innerHTML="<div class='error'>Passwords do not match.</div>";

return;

}

let user={

name:name,

email:email,

password:password

};

let existing=JSON.parse(localStorage.getItem("user"));

if(existing && existing.email==email){

msg.innerHTML="<div class='error'>Email already registered.</div>";

return;

}

localStorage.setItem("user",JSON.stringify(user));
msg.innerHTML="<div class='success'>Registration Successful! Redirecting...</div>";

setTimeout(function(){

window.location="login.html";

},1500);

}
function showPassword(){

    let password = document.getElementById("password");

    if(password.type === "password"){
        password.type = "text";
    }else{
        password.type = "password";
    }

}
</script>

</body>
</html>
